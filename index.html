<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151225">
<title>Biologia Stultis — Misión Genética</title>
<style>
:root{--bg:#eef7ff;--card:#fff;--ink:#20202a;--purple:#7026b5;--cyan:#54f5dc;--pink:#ff63dc;--green:#bff3ca;--yellow:#ffe39a;--red:#ffc0c0}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(135deg,#e4fbff,#f0e5ff);overflow-x:hidden}
button,input{font:inherit}
button{touch-action:manipulation}
.wrap{width:min(760px,100%);margin:auto;padding:12px}
.card{background:var(--card);border-radius:24px;padding:20px;margin:12px 0;box-shadow:0 8px 28px #00000018}
.hero{text-align:center}
.logo{display:block;width:min(500px,100%);height:auto;margin:auto}
.scientist{display:block;width:150px;margin:10px auto}
h1{font-size:clamp(28px,8vw,42px);margin:8px 0;color:var(--purple)}
h2{margin:12px 0}
.muted{color:#666}
.levels{display:grid;gap:12px;margin-top:18px}
.level,.main{border:0;border-radius:16px;min-height:60px;padding:14px;font-weight:800;cursor:pointer}
.level{font-size:18px}.easy{background:var(--green)}.medium{background:var(--yellow)}.hard{background:var(--red)}.locked{opacity:.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;background:#f3f3f5;border-radius:15px;padding:12px;text-align:center}
.progress{height:11px;background:#ddd;border-radius:20px;overflow:hidden;margin:12px 0 18px}.bar{height:100%;width:0;background:var(--purple);transition:.3s}
.level-title{text-align:center;font-weight:800}
.question{font-size:clamp(19px,5vw,25px);font-weight:800;line-height:1.4;text-align:center;margin:22px 0}
.option,.check{display:block;width:100%;min-height:58px;margin:8px 0;padding:13px;border:0;border-radius:15px;background:#eee;cursor:pointer}
.option:active,.check:active,.main:active,.level:active{transform:scale(.98)}
.answer{width:100%;min-height:58px;border:2px solid #ccc;border-radius:15px;padding:13px;outline:0}.answer:focus{border-color:var(--purple)}
.check,.main{background:var(--purple);color:#fff;font-weight:800}
.message{text-align:center;min-height:62px;margin:15px 0;line-height:1.5;font-weight:700}
.hidden{display:none!important}
.result{text-align:center}.medal{font-size:72px}
.small{font-size:13px;color:#666}
@media(max-width:450px){.wrap{padding:7px}.card{padding:15px;border-radius:19px}.stats{font-size:13px}}
</style>
</head>
<body>
<div class="wrap">

<section class="card hero">
<svg class="logo" viewBox="0 0 500 170" aria-label="Biologia Stultis">
<rect x="5" y="5" width="490" height="160" rx="30" fill="#171323"/>
<circle cx="65" cy="85" r="38" fill="#54f5dc"/>
<path d="M45 60Q65 85 45 110M85 60Q65 85 85 110" fill="none" stroke="#ff63dc" stroke-width="8"/>
<text x="115" y="82" font-size="42" font-family="Arial" font-weight="bold" fill="white">BIOLOGIA</text>
<text x="116" y="125" font-size="38" font-family="Arial" font-weight="bold" fill="#54f5dc">STULTIS</text>
</svg>

<svg class="scientist" viewBox="0 0 200 220" aria-label="científico caricaturesco original">
<circle cx="100" cy="55" r="43" fill="#55321e"/>
<circle cx="100" cy="70" r="34" fill="#ffd6ad"/>
<circle cx="87" cy="67" r="4"/><circle cx="113" cy="67" r="4"/>
<circle cx="87" cy="67" r="12" fill="none" stroke="#222" stroke-width="3"/>
<circle cx="113" cy="67" r="12" fill="none" stroke="#222" stroke-width="3"/>
<line x1="99" y1="67" x2="101" y2="67" stroke="#222" stroke-width="3"/>
<path d="M90 82Q100 90 110 82" fill="none" stroke="#222" stroke-width="3"/>
<path d="M65 110L135 110L155 205L45 205Z" fill="white" stroke="#7026b5" stroke-width="4"/>
<path d="M95 110L100 150L105 110" fill="#7026b5"/>
<line x1="60" y1="125" x2="25" y2="170" stroke="#ffd6ad" stroke-width="15" stroke-linecap="round"/>
<line x1="140" y1="125" x2="175" y2="170" stroke="#ffd6ad" stroke-width="15" stroke-linecap="round"/>
</svg>

<h1>🧬 Misión Genética</h1>
<p class="muted">Juego de Biologia Stultis para 9.º grado</p>
<p>10 preguntas por nivel, respuestas de opción múltiple y respuestas libres.</p>

<div class="levels">
<button class="level easy" id="easyBtn">🟢 MODO FÁCIL</button>
<button class="level medium locked" id="mediumBtn">🟡 MODO MEDIO 🔒</button>
<button class="level hard locked" id="hardBtn">🔴 MODO DIFÍCIL 🔒</button>
</div>
</section>

<section class="card hidden" id="game">
<div class="stats">
<div>❤️ <b id="lives">3</b></div>
<div>⭐ <b id="score">0</b></div>
<div>🧬 <b id="qnum">1</b>/10</div>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="level-title" id="levelTitle"></div>

<svg viewBox="0 0 200 100" width="170" height="90" aria-hidden="true" style="display:block;margin:auto">
<path d="M55 10C145 35 145 65 55 90M145 10C55 35 55 65 145 90" fill="none" stroke="#7026b5" stroke-width="7"/>
<path d="M68 23h64M58 45h84M68 77h64" stroke="#ff63dc" stroke-width="5"/>
</svg>

<div class="question" id="question"></div>
<div id="answers"></div>
<div class="message" id="message"></div>
<button class="main hidden" id="nextBtn">Siguiente ➜</button>
</section>

<section class="card result hidden" id="result">
<div id="resultContent"></div>
</section>

</div>

<script>
"use strict";

const questions = {
facil:[
{t:"choice",q:"¿Qué molécula contiene la información genética?",o:["ADN","Agua","Glucosa","Calcio"],a:0},
{t:"choice",q:"¿Qué es un gen?",o:["Una parte del ADN que contiene información","Un órgano","Una vitamina","Un tejido"],a:0},
{t:"number",q:"¿Cuántos cromosomas tiene normalmente una célula humana?",a:46},
{t:"choice",q:"¿Quién realizó experimentos famosos sobre la herencia con plantas de guisantes?",o:["Gregor Mendel","Charles Darwin","Isaac Newton","Louis Pasteur"],a:0},
{t:"text",q:"¿Cómo se llama la transmisión de características de padres a hijos?",a:["herencia"]},
{t:"choice",q:"¿Qué son los alelos?",o:["Versiones diferentes de un gen","Órganos","Proteínas","Tejidos"],a:0},
{t:"text",q:"¿Cuál es la molécula que tiene forma de doble hélice?",a:["adn"]},
{t:"choice",q:"¿Qué estructura contiene ADN y proteínas?",o:["Cromosoma","Glucosa","Ribosoma","Membrana"],a:0},
{t:"text",q:"¿Cómo se llama una característica observable de un organismo?",a:["fenotipo"]},
{t:"choice",q:"¿Qué puede producir una mutación?",o:["Un cambio en el ADN","Siempre una enfermedad","Siempre una ventaja","Nada"],a:0}
],
medio:[
{t:"choice",q:"Si A es dominante y a es recesivo, ¿cuál es heterocigoto?",o:["Aa","AA","aa","AAA"],a:0},
{t:"text",q:"¿Cómo se llama el conjunto de alelos de un organismo?",a:["genotipo"]},
{t:"choice",q:"¿Cuál es homocigoto dominante?",o:["AA","Aa","aa","AB"],a:0},
{t:"number",q:"¿Cuántos cromosomas tiene normalmente un gameto humano?",a:23},
{t:"choice",q:"¿Qué proceso produce células sexuales?",o:["Meiosis","Mitosis","Digestión","Fotosíntesis"],a:0},
{t:"text",q:"¿Cómo se llama el alelo que se expresa cuando está presente?",a:["dominante"]},
{t:"choice",q:"¿Qué sucede durante la fecundación?",o:["Se unen dos gametos","Desaparece el ADN","Se destruyen los cromosomas","Se divide una proteína"],a:0},
{t:"text",q:"¿Cómo se llaman las versiones diferentes de un gen?",a:["alelo","alelos"]},
{t:"choice",q:"¿Cuál es el genotipo homocigoto recesivo?",o:["aa","AA","Aa","AB"],a:0},
{t:"text",q:"¿Quién es considerado el padre de la genética?",a:["mendel","gregor"]}
],
dificil:[
{t:"choice",q:"En un cruce Aa × Aa, ¿qué probabilidad se espera para aa?",o:["25%","50%","75%","100%"],a:0},
{t:"number",q:"En un cruce Aa × Aa, ¿qué porcentaje esperado será Aa?",a:50},
{t:"choice",q:"Si se cruzan AA × aa, ¿qué genotipo tendrán los descendientes?",o:["Todos Aa","Todos AA","Todos aa","50% AA y 50% aa"],a:0},
{t:"number",q:"En un cruce Aa × aa, ¿qué porcentaje esperado será Aa?",a:50},
{t:"choice",q:"¿Qué ley de Mendel explica la separación de los alelos?",o:["Ley de segregación","Ley de gravedad","Ley celular","Ley de evolución"],a:0},
{t:"text",q:"¿Qué molécula lleva información del ADN para ayudar a producir proteínas?",a:["arn","mensajero"]},
{t:"choice",q:"¿Qué puede causar una mutación?",o:["Un cambio en la secuencia del ADN","Siempre una enfermedad","Siempre una ventaja","La desaparición de todos los cromosomas"],a:0},
{t:"text",q:"Si un organismo tiene genotipo AA, ¿es homocigoto o heterocigoto?",a:["homocigoto"]},
{t:"choice",q:"¿Qué estudia principalmente la genética?",o:["La herencia y variación de características","Los planetas","Los minerales","El clima"],a:0},
{t:"text",q:"¿Cómo se llama el proceso mediante el cual se forman gametos?",a:["meiosis"]}
]};

let level="", index=0, score=0, lives=3;
const unlocked={facil:true,medio:false,dificil:false};
const $=id=>document.getElementById(id);

function points(){return level==="facil"?100:level==="medio"?200:300}

function start(lvl){
 if(!unlocked[lvl]){alert("🔒 Primero completa el nivel anterior.");return}
 level=lvl; index=0; score=0; lives=3;
 $("game").classList.remove("hidden");
 $("result").classList.add("hidden");
 render();
 $("game").scrollIntoView({behavior:"smooth",block:"start"});
}

function render(){
 const p=questions[level][index];
 $("lives").textContent=lives;
 $("score").textContent=score;
 $("qnum").textContent=index+1;
 $("bar").style.width=((index)/10*100)+"%";
 $("levelTitle").textContent=level==="facil"?"🟢 NIVEL FÁCIL":level==="medio"?"🟡 NIVEL MEDIO":"🔴 NIVEL DIFÍCIL";
 $("question").textContent=p.q;
 $("answers").innerHTML="";
 $("message").innerHTML="";
 $("nextBtn").classList.add("hidden");

 if(p.t==="choice"){
   p.o.forEach((text,i)=>{
     const b=document.createElement("button");
     b.className="option"; b.textContent=text;
     b.addEventListener("click",()=>answerChoice(i));
     $("answers").appendChild(b);
   });
 }else{
   const input=document.createElement("input");
   input.id="answer"; input.className="answer";
   input.type=p.t==="number"?"number":"text";
   input.placeholder=p.t==="number"?"🔢 Escribe un número":"✍️ Escribe tu respuesta";
   $("answers").appendChild(input);
   const b=document.createElement("button");
   b.className="check"; b.textContent="🔍 COMPROBAR";
   b.addEventListener("click",p.t==="number"?answerNumber:answerText);
   $("answers").appendChild(b);
 }
}

function lockButtons(){
 document.querySelectorAll("#answers button").forEach(b=>b.disabled=true);
}

function finishAnswer(){
 $("lives").textContent=lives; $("score").textContent=score;
 if(lives<=0){finish(false);return}
 if(index===9){finish(true);return}
 $("nextBtn").classList.remove("hidden");
}

function answerChoice(i){
 lockButtons();
 const p=questions[level][index];
 if(i===p.a){score+=points();correct("¡Correcto! Tu neurona hizo horas extra. 🧠")}
 else{lives--;wrong("Respuesta correcta: "+p.o[p.a])}
 finishAnswer();
}

function answerText(){
 const input=$("answer"); const value=input.value.trim().toLowerCase();
 if(!value){alert("✍️ Escribe una respuesta.");return}
 lockButtons();
 const p=questions[level][index];
 const ok=p.a.some(x=>value.includes(x));
 if(ok){score+=points();correct("¡Correcto! Mendel estaría orgulloso. 🧬")}
 else{lives--;wrong("Respuesta esperada: "+p.a[0])}
 finishAnswer();
}

function answerNumber(){
 const input=$("answer"); const value=Number(input.value);
 if(!Number.isFinite(value)){alert("🔢 Escribe un número.");return}
 lockButtons();
 const p=questions[level][index];
 const d=Math.abs(value-p.a);
 let pct=d===0?100:d<=1?80:d<=3?60:d<=5?40:d<=10?20:0;
 const gained=Math.round(points()*pct/100);
 if(gained>0){
   score+=gained;
   $("message").innerHTML=(pct===100?"✅ ¡Perfecto!":"🟡 ¡Estuviste cerca! 🎯")+"<br>Tu respuesta: "+value+" · Correcta: "+p.a+"<br>⭐ +"+gained+" puntos";
 }else{lives--;wrong("Respuesta correcta: "+p.a)}
 finishAnswer();
}

function correct(text){
 $("message").innerHTML="✅ "+text+"<br>⭐ +"+points()+" puntos";
}
function wrong(text){
 const jokes=["La genética dijo: «¿En serio?» 😂","Tu neurona tomó un desvío evolutivo. 🧬","Hasta el microscopio quedó confundido. 😂"];
 $("message").innerHTML="❌ "+jokes[Math.floor(Math.random()*jokes.length)]+"<br>"+text;
}

$("nextBtn").addEventListener("click",()=>{
 index++; render(); $("game").scrollIntoView({behavior:"smooth",block:"start"});
});

function finish(won){
 $("game").classList.add("hidden");
 $("result").classList.remove("hidden");
 if(won){
   if(level==="facil"){unlocked.medio=true;$("mediumBtn").classList.remove("locked");$("mediumBtn").textContent="🟡 MODO MEDIO 🔓"}
   if(level==="medio"){unlocked.dificil=true;$("hardBtn").classList.remove("locked");$("hardBtn").textContent="🔴 MODO DIFÍCIL 🔓"}
   const medal=score>=2000?"🏆":score>=1200?"🥇":score>=600?"🥈":"🥉";
   $("resultContent").innerHTML=`<div class="medal">${medal}</div><h2>🎉 ¡Nivel completado!</h2><h2>⭐ ${score} puntos</h2><p>❤️ Vidas restantes: ${lives}</p><p>😂 Tu ADN sobrevivió al examen.</p><button class="main" id="retry">🔄 Jugar otra vez</button>`;
 }else{
   $("resultContent").innerHTML=`<div class="medal">😵‍💫</div><h2>¡Te quedaste sin vidas!</h2><h2>⭐ ${score} puntos</h2><p>Tu neurona necesita unas vacaciones. 😂</p><button class="main" id="retry">🔄 Intentar de nuevo</button>`;
 }
 $("retry").addEventListener("click",()=>start(level));
 $("result").scrollIntoView({behavior:"smooth",block:"start"});
}

$("easyBtn").addEventListener("click",()=>start("facil"));
$("mediumBtn").addEventListener("click",()=>start("medio"));
$("hardBtn").addEventListener("click",()=>start("dificil"));
</script>
</body>
</html>
